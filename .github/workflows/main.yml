name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 10/12 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch release info
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          echo "LATESTFLORIDARELEASETAG=$(curl -s https://api.github.com/repos/otakretak/undetected-frida/releases/latest | jq -r '.tag_name')" >> $GITHUB_ENV
          echo "LATESTMODULETAG=$(curl -s https://api.github.com/repos/otakretak/MagiskHluda/releases/latest | jq -r '.tag_name')" >> $GITHUB_ENV
      - name: Check if release needed
        id: check_release
        run: |
          FLORIDA_TAG="${{ env.LATESTFLORIDARELEASETAG }}"
          MODULE_TAG="${{ env.LATESTMODULETAG }}"

          # Rilis jika FLORIDA_TAG valid DAN (MODULE_TAG belum ada ATAU versi Florida beda)
          if [ -n "$FLORIDA_TAG" ] && [ "$FLORIDA_TAG" != "null" ]; then
            if [ -z "$MODULE_TAG" ] || [ "$MODULE_TAG" = "null" ] || [ "$FLORIDA_TAG" != "$MODULE_TAG" ]; then
              echo "should_release=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "should_release=false" >> $GITHUB_OUTPUT

      - name: Cache vcpkg
        if: steps.check_release.outputs.should_release == 'true'
        uses: actions/cache@v4
        with:
          path: |
            vcpkg
            ~/vcpkg/installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-
      - name: Setup vcpkg
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone --depth 1 https://github.com/Microsoft/vcpkg.git
            ./vcpkg/bootstrap-vcpkg.sh
            ./vcpkg/vcpkg install rapidjson restclient-cpp
          fi
      - name: Build MagiskHluda
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build build --config Release
          cp build/MagiskHluda .
      - name: Download Florida servers
        if: steps.check_release.outputs.should_release == 'true'
        run: ./MagiskHluda

      - name: Set up Node.js
        if: steps.check_release.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Bundle web UI with Vite
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          if [ ! -d "webroot" ]; then
            echo "Error: webroot directory not found"
            exit 1
          fi
          mkdir -p module_template/webroot
          cd webroot
          npm i
          npx vite build

      - name: Prepare release archives
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          for arch in arm arm64 x86 x86_64; do
            FILENAME="MagiskHluda-$([[ "$arch" == "x86_64" ]] && echo "x64" || echo "$arch").xz"
            mkdir -p "arch_release_$arch/bin"
            cp -r module_template/* "arch_release_$arch/"
            cp "bin/$FILENAME" "arch_release_$arch/bin/"
            (cd "arch_release_$arch" && zip -r "../MagiskHluda-$arch-$LATESTFLORIDARELEASETAG.zip" .)
          done
          mkdir -p universal_release
          cp -r module_template/* universal_release/
          mkdir -p "universal_release/bin"
          cp -r bin/* universal_release/bin/
          (cd universal_release && zip -r "../MagiskHluda-Universal-$LATESTFLORIDARELEASETAG.zip" .)
      - name: Release packages
        if: steps.check_release.outputs.should_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            ./*.zip
            update.json
          name: "Magisk Module for Undetected Frida Server ${{ env.LATESTFLORIDARELEASETAG }}"
          tag: "${{ env.LATESTFLORIDARELEASETAG }}"
          body: "Universal package and architecture-specific packages for Undetected Frida Server ${{env.LATESTFLORIDARELEASETAG}}"
          generateReleaseNotes: false
          token: ${{ secrets.GITHUB_TOKEN }}